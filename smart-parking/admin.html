    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>

    <section class="admin-container">
        <h1>Admin Dashboard</h1>
        <p>Manage parking slots and the customer queue.</p>

        <div class="admin-cards">
            <div class="admin-card">
                <h3>Total Slots</h3>
                <p id="totalSlots">5</p>
            </div>

            <div class="admin-card">
                <h3>Available Slots</h3>
                <p id="availableSlots">3</p>
            </div>

            <div class="admin-card">
                <h3>Occupied Slots</h3>
                <p id="occupiedSlots">2</p>
            </div>
        </div>

        <h2>Manage Parking</h2>

        <label for="adminSlot">Select Slot</label>
        <select id="adminSlot">
            <option value="P01">P01</option>
            <option value="P02">P02</option>
            <option value="P03">P03</option>
            <option value="P04">P04</option>
            <option value="P05">P05</option>
        </select>

        <button onclick="updateSlot('Available')">
            Mark Available
        </button>

        <button onclick="updateSlot('Occupied')">
            Mark Occupied
        </button>
         
<h2>Manage Bookings</h2>

<label for="bookingId">Booking ID</label>
<input type="number" id="bookingId" placeholder="Enter Booking ID">

<button onclick="completeBooking()">Complete Booking</button>

<p id="bookingMessage"></p>
        <h2>Queue Management</h2>
