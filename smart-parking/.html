<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve Parking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <h2>Smart Parking</h2>
        <a href="index.html">Home</a>
        <a href="parking.html">Parking</a>
        <a href="reservee.html">reservee</a>
        <a href="queue.html">Queue</a>
    </nav>

    <section class="reservation">
        <h1>Reserve Your Parking Slot</h1>
        <p>Enter your details to request a parking reservation.</p>

        <form id="reservationForm">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName"
                   placeholder="Enter your name" required>

            <label for="vehicleNumber">Vehicle Number</label>
            <input type="text" id="vehicleNumber"
                   placeholder="Example: TN 74 AB 1234" required>

            <label for="slotNumber">Parking Slot</label>
            <select id="slotNumber" required>
                <option value="">Select a slot</option>
                <option value="P01">P01</option>
                <option value="P02">P02</option>
                <option value="P04">P04</option>
            </select>

            <label for="bookingDate">Booking Date</label>
            <input type="date" id="bookingDate" required>

            <button type="submit">Confirm Reservation</button>
        </form>

        <p id="bookingMessage"></p>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
